name: Bug
description: Quelque chose ne marche pas comme prévu
title: "Bug · "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Ce qui était attendu
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version d'Owlcy / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs (%APPDATA%/Owlcy/logs) — sans secrets
      render: text
