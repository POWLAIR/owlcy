# Backlog Owlcy — SOURCE DE VÉRITÉ
# Modifier ce fichier puis : python scripts/github_bootstrap.py docs   (régénère la doc)
#                            python scripts/github_bootstrap.py push    (synchronise GitHub)
# Vocabulaire : doc/lexique.md. Points : 1, 2, 3, 5, 8 (suite de Fibonacci). Capacité supposée : 12 pts / sprint.

project:
  name: Owlcy
  repo: POWLAIR/owlcy
  sprint_length_days: 14
  first_sprint_start: 2026-10-05
  capacity_points: 12

releases:
  - { version: v0.1.0, sprint: 5, name: "MVP — la Veilleuse" }
  - { version: v0.2.0, sprint: 8, name: "Extensible — factory, déclencheurs, mode agent" }
  - { version: v0.3.0, sprint: 11, name: "Vivant — Mécano, skins, éditeur de pipelines" }
  - { version: v0.4.0, sprint: 14, name: "Autonome — runtimes externes, apprentissage, paquets" }

sprints:
  - { n: 0,  days: 21, goal: "Labo : prouver les points risqués et décider (go / no-go)" }
  - { n: 1,  goal: "Fondations : dépôt, CI, squelette Tauri + moteur qui se parlent" }
  - { n: 2,  goal: "Perchoir : la chouette vit sur le bureau Windows" }
  - { n: 3,  goal: "Moteur : configuration, bus d'événements, hôte MCP" }
  - { n: 4,  goal: "Pipelines : exécuter une pipeline YAML avec étape humaine et LLM" }
  - { n: 5,  goal: "MVP : la Veilleuse publie ma veille chaque matin" }
  - { n: 6,  goal: "Dashboard : voir, comprendre et relancer les runs" }
  - { n: 7,  goal: "Factory & déclencheurs" }
  - { n: 8,  goal: "Mode agent, skills et presets d'autonomie" }
  - { n: 9,  goal: "Mécano : piloter les validations Claude Code depuis la chouette" }
  - { n: 10, goal: "Skins & personnalité visuelle" }
  - { n: 11, goal: "Éditeur de pipelines & mode vivant" }
  - { n: 12, goal: "Runtimes externes (Hermes)" }
  - { n: 13, goal: "Mémoire & Forgeronne" }
  - { n: 14, goal: "Mode nuit & paquets partageables" }

areas: [shell, engine, ui, design, integrations, pipelines, security, llm, devops, doc]

epics:
  - { id: E0,  title: "Labo & décisions", desc: "Tests techniques go / no-go et ADR avant tout développement." }
  - { id: E1,  title: "Fondations", desc: "Dépôt, conventions, CI, squelette shell + moteur, packaging." }
  - { id: E2,  title: "Perchoir & chouette", desc: "Overlay Windows, chouette SVG, emotes, bulle, tray." }
  - { id: E3,  title: "Moteur & intégrations", desc: "Configuration, bus d'événements, hôte MCP, outils internes." }
  - { id: E4,  title: "Pipelines", desc: "Moteur de pipelines YAML, étapes, expressions, runs." }
  - { id: E5,  title: "La Veilleuse (MVP)", desc: "Première Owl utile de bout en bout." }
  - { id: E6,  title: "Sécurité & secrets", desc: "Permissions, coffre de secrets, anti-injection, audit." }
  - { id: E7,  title: "Dashboard", desc: "Fenêtre principale : runs, Owls, réglages." }
  - { id: E8,  title: "Factory & déclencheurs", desc: "Modèles de pipelines, formulaires, nouveaux déclencheurs." }
  - { id: E9,  title: "Mode agent & skills", desc: "ToolLoopAgent, SKILL.md, presets d'autonomie, plan/validate." }
  - { id: E10, title: "Mécano", desc: "Hooks Claude Code, relais des validations." }
  - { id: E11, title: "Design avancé", desc: "Skins, sons, éditeur de pipelines, mode vivant." }
  - { id: E12, title: "Runtimes externes", desc: "Adaptateur de runtime, Hermes." }
  - { id: E13, title: "Mémoire & Forgeronne", desc: "Carnet, archive, apprentissage, génération d'intégrations." }
  - { id: E14, title: "Partage", desc: "Mode nuit, paquets signés." }

stories:
  # ───────────────────────── Sprint 0 — Labo ─────────────────────────
  - id: US-001
    type: chore
    title: Créer le dépôt, le GitHub Project et importer le backlog
    epic: E0
    sprint: 0
    points: 1
    prio: P0
    area: [devops]
    story: En tant que développeur, je veux un dépôt et un board GitHub prêts, afin de suivre le projet sprint par sprint.
    ac:
      - Le dépôt POWLAIR/owlcy existe avec la doc (dossier doc/) et le labo (poc/)
      - Labels, milestones (sprints) et issues sont créés par scripts/github_bootstrap.py
      - Le GitHub Project a les champs Status, Priority, Estimate, Epic et 3 vues (Board du sprint, Table backlog, Roadmap)
  - id: US-002
    type: spike
    title: "W1 — Perchoir Tauri sous Windows (overlay, focus, click-through)"
    epic: E0
    sprint: 0
    points: 5
    prio: P0
    area: [shell]
    story: En tant que développeur, je veux prouver qu'une chouette peut vivre au-dessus du bureau Windows sans gêner, afin de valider le cœur de l'expérience.
    ac:
      - Le spike poc/windows/w1-perchoir-tauri compile et se lance (corrections notées)
      - Les vérifications 1.1 à 1.15 de poc/README.md sont renseignées
      - Critères GO — focus jamais volé, click-through hors chouette, pas de Focus Assist, < 150 Mo privés et < 1 % CPU au repos
      - Décision GO / NO-GO écrite dans doc/techno/03-resultats-tests.md
  - id: US-003
    type: spike
    title: "W2 — Mesurer la mémoire réelle (processus + WebView2)"
    epic: E0
    sprint: 0
    points: 1
    prio: P0
    area: [shell]
    story: En tant que développeur, je veux la RAM réelle de l'overlay, afin de trancher le débat 14 Mo / 317 Mo.
    ac:
      - mesure-memoire.ps1 exécuté 60 s sur le spike W1 et sur une appli Electron de référence
      - Résultats (privé, working set, nb de processus, CPU) reportés dans 03-resultats-tests.md
  - id: US-004
    type: spike
    title: "W3 — Intégrations WSL via wsl.exe (latence stdio, /mnt/c)"
    epic: E0
    sprint: 0
    points: 1
    prio: P1
    area: [integrations]
    story: En tant que développeur, je veux savoir si une intégration peut tourner dans WSL, afin de réutiliser mes outils Linux.
    ac:
      - wsl_stdio_bench.py exécuté côté Windows
      - GO si RTT p95 < 5 ms et démarrage à froid < 1,5 s
  - id: US-005
    type: spike
    title: "W4 — Fiabilité des appels d'outils des modèles locaux (RTX 500 Ada, 4 Go de VRAM)"
    epic: E0
    sprint: 0
    points: 2
    prio: P0
    area: [llm]
    story: En tant que développeur, je veux mesurer mes modèles locaux sur nos scénarios, afin de choisir le modèle par défaut des étapes llm.
    ac:
      - bench_ollama_tools.py exécuté sur au moins 4 modèles (dont un 3-4B et un 8B)
      - Tableau score global, par type (simple, choix, parallèle, chaîné, refus) et tokens/s publié
      - Modèle par défaut choisi (ADR) ; décision « mode agent local ou cloud »
  - id: US-006
    type: spike
    title: "W5 — Secrets dans le Windows Credential Manager"
    epic: E0
    sprint: 0
    points: 1
    prio: P1
    area: [security]
    story: En tant qu'utilisateur, je veux que mes clés API soient dans le coffre de Windows, afin qu'elles ne traînent jamais dans un fichier.
    ac:
      - test_keyring.py réussi, entrée visible puis supprimée dans le Gestionnaire d'identification
  - id: US-007
    type: spike
    title: "T5-T7 — AI SDK 7 + Ollama + MCP, JSONata, SDK MCP TS v2"
    epic: E0
    sprint: 0
    points: 3
    prio: P0
    area: [engine, llm]
    story: En tant que développeur, je veux valider la chaîne TypeScript du moteur, afin de confirmer le choix sidecar TS.
    ac:
      - Un script TS appelle un modèle Ollama avec un outil MCP (stdio) via AI SDK 7 et affiche le résultat
      - needsApproval déclenche bien une demande avant exécution
      - "5 expressions JSONata de doc/feature/02 évaluées (dont $count, filtrage, aplatissement)"
      - Un serveur MCP TS v2 renvoie inputRequired (MRTR) et le client le gère
      - Binaire Bun compilé pour Windows (--target=bun-windows-x64) démarré sur le PC
  - id: US-008
    type: chore
    title: Écrire les ADR des décisions bloquantes (Q1, Q2, Q7, Q13)
    epic: E0
    sprint: 0
    points: 2
    prio: P0
    area: [doc]
    story: En tant que développeur, je veux des décisions écrites et justifiées par les tests, afin de ne plus les rediscuter.
    ac:
      - ADR-001 moteur TS sidecar vs Rust ; ADR-002 MCP + outils internes ; ADR-003 Windows natif + WSL ; ADR-004 moteur de pipelines maison
      - Chaque ADR cite les résultats de tests qui la justifient

  # ───────────────────────── Sprint 1 — Fondations ─────────────────────────
  - id: US-010
    type: chore
    title: Monorepo et conventions de code
    epic: E1
    sprint: 1
    points: 2
    prio: P0
    area: [devops]
    story: En tant que développeur, je veux une structure de dépôt claire, afin de savoir où va chaque chose.
    ac:
      - apps/shell (Tauri), apps/engine (TS), packages/ui, packages/schemas, integrations/, examples/
      - Lint + format (Biome ou ESLint/Prettier, rustfmt/clippy), commits conventionnels, .editorconfig
      - AGENTS.md / CLAUDE.md à la racine qui renvoie vers doc/lexique.md
  - id: US-011
    type: chore
    title: CI GitHub Actions (Windows) — lint, tests, build
    epic: E1
    sprint: 1
    points: 3
    prio: P0
    area: [devops]
    story: En tant que développeur, je veux que chaque PR soit vérifiée automatiquement sur Windows, afin de ne jamais casser main.
    ac:
      - Workflow sur windows-latest - lint, tests unitaires moteur, cargo check, build Tauri
      - L'installeur NSIS est publié en artefact sur main
      - Protection de branche - PR obligatoire + CI verte
  - id: US-012
    type: us
    title: Le shell lance le moteur et ils se parlent
    epic: E1
    sprint: 1
    points: 5
    prio: P0
    area: [shell, engine]
    story: En tant que développeur, je veux que Tauri démarre le moteur TS compilé et échange des messages avec lui, afin d'avoir le squelette de l'application.
    ac:
      - Le moteur (binaire Bun) est embarqué comme sidecar et lancé au démarrage
      - Canal JSON-RPC shell <-> moteur (stdio), ping aller-retour affiché dans une fenêtre de debug
      - Si le moteur plante, le shell le relance et le signale (événement engine.restarted)
      - Aucun port réseau ouvert (vérifié avec netstat)
  - id: US-013
    type: chore
    title: Journalisation unifiée (shell + moteur)
    epic: E1
    sprint: 1
    points: 2
    prio: P1
    area: [engine, shell]
    story: En tant que développeur, je veux des logs lisibles au même endroit, afin de diagnostiquer vite.
    ac:
      - Logs JSON dans %APPDATA%/Owlcy/logs, rotation, niveau réglable
      - Aucun secret dans les logs (test)

  # ───────────────────────── Sprint 2 — Perchoir ─────────────────────────
  - id: US-020
    type: us
    title: Voir la chouette sur mon bureau sans qu'elle me gêne
    epic: E2
    sprint: 2
    points: 5
    prio: P0
    area: [shell, ui]
    story: En tant qu'utilisateur, je veux une chouette en bas de l'écran qui ne vole jamais le focus et laisse passer mes clics, afin de l'avoir toujours là sans être dérangé.
    ac:
      - Reprise du code validé en W1 (fenêtre petite, WS_EX_NOACTIVATE, NonRudeHWND, hit-test)
      - Position réglable (coin, écran) et mémorisée
      - Pas dans Alt+Tab ni la barre des tâches ; icône dans le tray (Quitter, Masquer)
  - id: US-021
    type: us
    title: Une chouette vivante (respiration, clignements, regard)
    epic: E2
    sprint: 2
    points: 3
    prio: P0
    area: [design, ui]
    story: En tant qu'utilisateur, je veux une chouette qui respire, cligne des yeux et me suit du regard, afin qu'elle paraisse vivante.
    ac:
      - Composant React Owl en SVG procédural, paramétré par un skin (couleurs, formes)
      - Yeux qui suivent le curseur sur tout l'écran (position envoyée par le shell)
      - 30 fps en idle, animation coupée quand la chouette est masquée (mesure < 0,5 ms/s en pause)
  - id: US-022
    type: us
    title: Des emotes qui reflètent ce qui se passe
    epic: E2
    sprint: 2
    points: 2
    prio: P1
    area: [design, ui]
    story: En tant qu'utilisateur, je veux voir si la chouette réfléchit, travaille, est contente ou en erreur, afin de comprendre l'état sans ouvrir de fenêtre.
    ac:
      - Emotes idle, thinking, working, ask, happy, dizzy, sleepy
      - Pilotées par des événements (emote.set) — testables depuis la fenêtre de debug
  - id: US-023
    type: us
    title: Bulle avec demande de validation
    epic: E2
    sprint: 2
    points: 2
    prio: P0
    area: [ui]
    story: En tant qu'utilisateur, je veux que la chouette me pose une question dans une bulle avec Autoriser / Refuser, afin de garder le contrôle sur ses actions.
    ac:
      - Événement approval.requested -> bulle ; réponse -> approval.answered
      - La bulle ne vole pas le focus ; fermeture auto configurable ; file d'attente si plusieurs demandes

  # ───────────────────────── Sprint 3 — Moteur ─────────────────────────
  - id: US-030
    type: us
    title: Configuration en fichiers YAML validés et rechargés à chaud
    epic: E3
    sprint: 3
    points: 3
    prio: P0
    area: [engine]
    story: En tant qu'utilisateur avancé, je veux décrire Owls, intégrations et pipelines en YAML, afin de tout personnaliser sans coder.
    ac:
      - Dossier %APPDATA%/Owlcy avec owls/, integrations/, skills/, pipelines/, skins/
      - JSON Schemas publiés dans packages/schemas ; erreur de validation -> pelote avec la ligne fautive
      - Modification d'un fichier -> rechargement sans redémarrer
  - id: US-031
    type: us
    title: Bus d'événements moteur -> shell -> UI
    epic: E3
    sprint: 3
    points: 2
    prio: P0
    area: [engine, ui]
    story: En tant que développeur, je veux que tout passe par des événements typés, afin d'ajouter des fonctionnalités sans toucher au cœur.
    ac:
      - Événements typés (run.*, step.*, approval.*, emote.*, engine.*) partagés entre moteur et UI
      - La chouette s'anime uniquement via ces événements
  - id: US-032
    type: us
    title: Hôte MCP (démarrage à la demande, arrêt après inactivité)
    epic: E3
    sprint: 3
    points: 5
    prio: P0
    area: [engine, integrations]
    story: En tant qu'utilisateur, je veux brancher n'importe quel serveur MCP via un owlcy.yaml, afin d'étendre Owlcy sans coder.
    ac:
      - Intégration déclarée (command, args, env, target windows|wsl) -> outils listés
      - Processus lancé au premier appel, arrêté après N minutes d'inactivité (mesure RAM avant/après)
      - Élicitation MCP relayée en demande de validation (bulle)
  - id: US-033
    type: us
    title: Outils internes de base
    epic: E3
    sprint: 3
    points: 2
    prio: P1
    area: [engine]
    story: En tant que développeur, je veux des outils courants intégrés au moteur, afin d'éviter un processus de 50 Mo par petit outil.
    ac:
      - owl.say, http.fetch, fs.read, fs.write, fs.move disponibles sans processus séparé
      - Même interface (schéma d'entrée/sortie) que les outils MCP

  # ───────────────────────── Sprint 4 — Pipelines ─────────────────────────
  - id: US-040
    type: us
    title: Exécuter une pipeline YAML séquentielle
    epic: E4
    sprint: 4
    points: 5
    prio: P0
    area: [pipelines]
    story: En tant qu'utilisateur, je veux lancer une pipeline décrite en YAML, afin d'automatiser une tâche répétitive.
    ac:
      - Étapes tool et llm ; foreach ; when ; variables entre étapes en JSONata
      - Événements step.* émis ; la chouette passe en working pendant le run
      - Dry-run disponible (aucun effet de bord)
  - id: US-041
    type: us
    title: Étape humaine dans une pipeline
    epic: E4
    sprint: 4
    points: 2
    prio: P0
    area: [pipelines, ui]
    story: En tant qu'utilisateur, je veux qu'une pipeline puisse s'arrêter pour me demander mon avis, afin de valider avant une action.
    ac:
      - Étape human -> bulle -> reprise ou arrêt selon la réponse
      - Délai d'expiration configurable
  - id: US-042
    type: us
    title: Étapes LLM avec Ollama et Claude
    epic: E4
    sprint: 4
    points: 3
    prio: P0
    area: [llm]
    story: En tant qu'utilisateur, je veux choisir le modèle de chaque Owl (local ou cloud), afin d'arbitrer coût, confidentialité et qualité.
    ac:
      - Provider Ollama et Anthropic via AI SDK ; modèle par défaut = celui choisi en W4
      - Sortie structurée validée par schéma + 1 retry automatique
      - Tokens et durée enregistrés dans le run
  - id: US-043
    type: us
    title: Historique des runs en SQLite
    epic: E4
    sprint: 4
    points: 2
    prio: P1
    area: [engine]
    story: En tant qu'utilisateur, je veux garder la trace de chaque run, afin de comprendre ce qui s'est passé.
    ac:
      - Runs, étapes, entrées/sorties, durées, décisions de permission stockés
      - Commande CLI owlcy runs list / show <id>

  # ───────────────────────── Sprint 5 — MVP Veilleuse ─────────────────────────
  - id: US-050
    type: us
    title: Intégration RSS
    epic: E5
    sprint: 5
    points: 2
    prio: P0
    area: [integrations]
    story: En tant qu'utilisateur, je veux lister les articles de mes flux, afin d'alimenter ma veille.
    ac:
      - Outil rss.fetch(url, since_hours) ; sortie marquée non fiable (untrusted-output)
      - Tests sur 3 flux réels (RSS et Atom)
  - id: US-051
    type: us
    title: Publication dans Notion
    epic: E5
    sprint: 5
    points: 2
    prio: P0
    area: [integrations, security]
    story: En tant qu'utilisateur, je veux que le digest soit publié dans ma base Notion, afin de le retrouver avec le reste.
    ac:
      - Serveur MCP Notion officiel branché via owlcy.yaml
      - Token Notion stocké dans le Credential Manager (secret-ref)
  - id: US-052
    type: us
    title: Pipeline « Veille du matin » + skill veille-techno
    epic: E5
    sprint: 5
    points: 3
    prio: P0
    area: [pipelines, llm]
    story: En tant qu'utilisateur, je veux un digest de 5 points avec sources chaque matin, afin de rester à jour en 2 minutes.
    ac:
      - Pipeline collect -> filtre -> digest -> validation -> publication -> owl.say
      - Skill veille-techno (SKILL.md) utilisée pour le digest
      - Changer ses sources et sujets = modifier les params, sans code
  - id: US-053
    type: us
    title: Déclencheur planifié
    epic: E5
    sprint: 5
    points: 2
    prio: P0
    area: [engine]
    story: En tant qu'utilisateur, je veux que la veille tourne seule à 8 h en semaine, afin de ne pas y penser.
    ac:
      - Trigger schedule (cron) ; rattrapage si le PC était éteint (option)
      - Lancement automatique d'Owlcy au démarrage de Windows (option)
  - id: US-054
    type: us
    title: Permissions par Owl (allow / ask / deny)
    epic: E6
    sprint: 5
    points: 2
    prio: P0
    area: [security]
    story: En tant qu'utilisateur, je veux décider ce que chaque Owl peut faire seule, afin qu'elle n'agisse jamais sans mon accord sur l'important.
    ac:
      - Le Permission Guard intercepte chaque appel d'outil selon permissions dans owl.yaml
      - ask -> bulle ; deny -> pelote explicite ; décision journalisée dans le run
  - id: US-055
    type: chore
    title: Release v0.1.0 (installeur + notes)
    epic: E1
    sprint: 5
    points: 1
    prio: P0
    area: [devops]
    story: En tant qu'utilisateur, je veux installer Owlcy en un clic, afin de l'utiliser au quotidien.
    ac:
      - Installeur NSIS publié en GitHub Release, notes générées depuis les PR
      - Critère de sortie du MVP vérifié pendant 5 jours ouvrés d'affilée

  # ───────────────────────── Sprint 6 — Dashboard ─────────────────────────
  - { id: US-060, type: us, title: "Liste et détail des runs", epic: E7, sprint: 6, points: 5, prio: P1, area: [ui],
      story: "En tant qu'utilisateur, je veux voir mes runs et le détail de chaque étape, afin de comprendre ce qu'a fait une Owl.",
      ac: ["Liste filtrable (Owl, pipeline, statut, date)", "Détail - entrées/sorties par étape, durée, tokens, décisions"] }
  - { id: US-061, type: us, title: "Pelote : rapport d'erreur lisible et relance", epic: E7, sprint: 6, points: 3, prio: P1, area: [ui, pipelines],
      story: "En tant qu'utilisateur, je veux comprendre une erreur et relancer depuis l'étape fautive, afin de ne pas tout refaire.",
      ac: ["Clic sur la chouette étourdie -> pelote", "Bouton relancer depuis l'étape N"] }
  - { id: US-062, type: us, title: "Réglages et gestion des secrets", epic: E6, sprint: 6, points: 3, prio: P1, area: [ui, security],
      story: "En tant qu'utilisateur, je veux gérer mes clés et réglages dans une fenêtre, afin de ne pas éditer de fichiers pour ça.",
      ac: ["Ajout/suppression de secrets (Credential Manager), jamais réaffichés en clair", "Modèle par défaut, position du perchoir, démarrage auto"] }

  # ───────────────────────── Sprint 7 — Factory & déclencheurs ─────────────────────────
  - { id: US-070, type: us, title: "Instancier une pipeline depuis un modèle", epic: E8, sprint: 7, points: 5, prio: P1, area: [ui, pipelines],
      story: "En tant qu'utilisateur, je veux créer une pipeline à partir d'un modèle et d'un formulaire, afin de ne pas écrire de YAML.",
      ac: ["Formulaire généré depuis le JSON Schema des params (types string, number, bool, date, file, list, secret-ref)", "La pipeline créée est un fichier YAML lisible"] }
  - { id: US-071, type: us, title: "Déclencheurs hotkey, drop et file_watch", epic: E8, sprint: 7, points: 3, prio: P1, area: [shell, engine],
      story: "En tant qu'utilisateur, je veux lancer une pipeline par raccourci, en glissant un fichier sur la chouette ou quand un fichier arrive, afin d'aller vite.",
      ac: ["Raccourci global configurable", "Glisser-déposer sur la chouette -> choix des pipelines compatibles", "Surveillance d'un dossier (ex. Téléchargements)"] }
  - { id: US-072, type: us, title: "skip_if_unchanged et continuity", epic: E4, sprint: 7, points: 2, prio: P2, area: [pipelines],
      story: "En tant qu'utilisateur, je veux qu'une pipeline planifiée n'appelle pas le LLM si rien n'a changé, afin d'économiser des tokens.",
      ac: ["Option skip_if_unchanged sur un step", "Variable previous.output disponible"] }

  # ───────────────────────── Sprint 8 — Mode agent & skills ─────────────────────────
